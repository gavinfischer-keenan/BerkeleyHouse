kind = "web"
previewPath = "/"
title = "Berkeley Command Center"
version = "1.0.0"
id = "artifacts/berkeley"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19699

[services.development]
run = "pnpm --filter @workspace/berkeley run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/berkeley", "run", "build" ]
publicDir = "artifacts/berkeley/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19699"
BASE_PATH = "/"
